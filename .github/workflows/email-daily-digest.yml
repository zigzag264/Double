name: Email Digest (Daily)

on:
  schedule:
    # 每天 UTC 09:00 = 北京时间 17:00
    # 发送前会先尽力刷新开奖数据与预测（见下方步骤），避免定时任务相互延迟导致误报
    # “开奖数据未更新”；刷新失败时沿用现有数据并显示过期警告
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      # GitHub 定时任务可能延迟数小时，且各工作流延迟程度不同：
      # 邮件任务可能先于数据更新任务触发，开奖夜就会误报“开奖数据未更新”。
      # 发送前先尽力刷新一次数据与预测；任一步失败则沿用现有数据并照常显示过期警告。
      - name: Install fetch dependencies (best effort)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Refresh lottery data (best effort)
        continue-on-error: true
        run: |
          cd fetch_history
          python3 fetch_lottery_history.py

      - name: Refresh predictions (best effort)
        continue-on-error: true
        run: python3 generate_ai_prediction.py

      - name: Send digest email
        run: python3 email_daily_digest.py
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
