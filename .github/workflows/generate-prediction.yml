name: Generate Prediction

on:
  schedule:
    # 兜底：每周一三五 UTC 00:00（北京时间 08:00）
    # 正常预测已由 update-lottery-data.yml 在开奖当晚（北京 22:30）生成；
    # 这里再跑一次，防止当晚抓取失败导致邮件继续沿用上一期（已开奖）的预测。
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      # 先尽力抓一次开奖数据；失败也不影响后续（现有数据若已是最新仍可继续）
      - name: Refresh lottery data (best effort)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          cd fetch_history
          python3 fetch_lottery_history.py

      - name: Generate stats model predictions
        run: python3 generate_ai_prediction.py

      - name: Commit & push predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lottery_history.json data/ai_predictions.json data/predictions_history.json fetch_history/lottery_data.json
          git diff --staged --quiet || git commit -m "chore: generate stats predictions $(date -u '+%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin master
          git push
